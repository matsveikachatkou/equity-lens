[project]
name = "equity_lens"
version = "0.1.0"
description = "equity-lens using crewAI"
authors = [{ name = "Matsvei Kachatkou", email = "matsvei.kachatkou@gmail.com" }]
requires-python = ">=3.11,<3.13"
dependencies = [
    "crewai[tools]==0.186.1",
    "python-dotenv>=1.0.1",
    "requests>=2.32.3",
    "yfinance>=1.4.1",
]
[project.scripts]
equity_lens = "equity_lens.main:run"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/equity_lens"]
[tool.uv]
required-environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64'"]
