[project]
name = "equity_lens"
version = "0.1.0"
description = "equity-lens using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=0.130.0,<1.0.0"
]

[project.scripts]
equity_lens = "equity_lens.main:run"
run_crew = "equity_lens.main:run"
train = "equity_lens.main:train"
replay = "equity_lens.main:replay"
test = "equity_lens.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
